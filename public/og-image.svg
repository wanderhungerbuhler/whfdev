<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#FF4D6D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#FF80A6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF80A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#FF8A4A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A4A"/>
      <stop offset="0.5" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#FF6FBF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#FF4D6D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4D6D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF4D6D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Top beam -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#rule)"/>

  <!-- Brand lockup (top-left) — matches favicon/logo-lockup -->
  <g transform="translate(80, 72) scale(2.0)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="#0E0E10" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <path d="M7 10 L11 22 L14.5 14 L16 14 L19.5 22 L23.5 10"
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="25.5" cy="24" r="2" fill="#FF4D6D"/>
    <text x="44" y="22" font-family="Geist, Inter, system-ui, sans-serif"
          font-size="17" font-weight="600" letter-spacing="-0.4" fill="#FFFFFF">whfdev</text>
    <line x1="120" y1="9" x2="120" y2="23" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="130" y="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
          font-size="10" letter-spacing="2.2" fill="#9A9A9A">TECH CONSULTING</text>
  </g>

  <!-- Display title -->
  <g transform="translate(80, 230)" font-family="'Geist', 'Inter', system-ui, sans-serif" font-size="84" font-weight="600" letter-spacing="-3.5">
    <text fill="url(#title-grad)">Construímos produtos</text>
    <text y="100" fill="url(#title-grad)">digitais</text>
    <text y="100" fill="url(#title-grad)"><tspan dx="320">que</tspan><tspan dx="20" fill="url(#accent-grad)">escalam</tspan></text>
    <text y="200" fill="url(#title-grad)">com você.</text>
  </g>

  <!-- Bottom rule -->
  <rect x="80" y="540" width="1040" height="1" fill="url(#rule)"/>

  <!-- Footer row -->
  <g transform="translate(80, 575)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#9A9A9A" letter-spacing="2">
    <text>CRM · DASHBOARDS · WEB · iOS · ANDROID · E-COMMERCE</text>
  </g>
  <g transform="translate(1120, 575)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#FFFFFF" letter-spacing="3" text-anchor="end">
    <text>WHFDEV.COM</text>
  </g>

  <!-- Right side mark (favicon-style) -->
  <g transform="translate(1064, 78) scale(1.7)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="#0E0E10" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <path d="M7 10 L11 22 L14.5 14 L16 14 L19.5 22 L23.5 10"
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="25.5" cy="24" r="2" fill="#FF4D6D"/>
  </g>
</svg>
