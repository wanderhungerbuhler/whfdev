<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#FF4D6D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#FF80A6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF80A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#FF8A4A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A4A"/>
      <stop offset="0.5" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#FF6FBF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#FF4D6D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4D6D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF4D6D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Top beam -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#rule)"/>

  <!-- Mono eyebrow chip -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="290" height="34" rx="17" fill="#0E0E10" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="20" cy="17" r="4" fill="#FF4D6D"/>
    <text x="36" y="22" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#E5E5E5" letter-spacing="2">
      WHFDEV — TECH CONSULTING · EST. 2011
    </text>
  </g>

  <!-- Display title -->
  <g transform="translate(80, 220)">
    <text font-family="'Geist', 'Inter', system-ui, sans-serif" font-size="96" fill="url(#title-grad)" font-weight="600" letter-spacing="-4">
      Software com
    </text>
    <text y="112" font-family="'Geist', 'Inter', system-ui, sans-serif" font-size="96" fill="url(#accent-grad)" font-weight="600" letter-spacing="-4">
      bom gosto,
    </text>
    <text y="224" font-family="'Geist', 'Inter', system-ui, sans-serif" font-size="96" fill="url(#title-grad)" font-weight="600" letter-spacing="-4">
      entregue no prazo.
    </text>
  </g>

  <!-- Bottom rule -->
  <rect x="80" y="540" width="1040" height="1" fill="url(#rule)"/>

  <!-- Footer row -->
  <g transform="translate(80, 575)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#9A9A9A" letter-spacing="2">
    <text>CRM · DASHBOARDS · WEB · iOS · ANDROID · E-COMMERCE</text>
  </g>
  <g transform="translate(1120, 575)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#FFFFFF" letter-spacing="3" text-anchor="end">
    <text>WHFDEV.COM</text>
  </g>

  <!-- Right side mark -->
  <g transform="translate(1080, 95)">
    <rect x="-26" y="-26" width="52" height="52" rx="14" fill="#0E0E10" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Geist', 'Inter', sans-serif" font-size="26" font-weight="700" fill="url(#accent-grad)">W</text>
  </g>
</svg>
